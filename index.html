<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes tâches</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #f4f4f4; font-size: 18px; }
  h1 { font-size: 24px; margin: 4px 0 12px; }
  input, select, button { font-size: 18px; padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { background: #2a6; color: white; border: none; border-radius: 8px; }
  .tache { background: white; border-radius: 8px; padding: 10px; margin: 8px 0; }
  .fait { background: #c33; padding: 6px; margin-top: 6px; }
  .petit { color: #555; font-size: 15px; }
  .ligne { display: flex; gap: 6px; align-items: center; }
  .mic { width: 60px; flex: none; }
  .prio { display: flex; gap: 6px; align-items: center; }
  .prio span { width: 60px; flex: none; font-size: 14px; color: #555; text-align: center; }
  .p { background: #ddd; color: #333; flex: 1; }
  .p.on { background: #2a6; color: white; font-weight: bold; }
  .gris { background: #777; }
  .fini { background: #e8e8e8; }
</style>
</head>
<body>
<h1>Mes tâches</h1>
<select id="langue"><option value="fr-FR">Français</option><option value="ar-SA">العربية</option></select>

<div class="ligne"><button class="mic" onclick="ecouter('texte')">🎤</button><input id="texte" placeholder="Quelle tâche ?"></div>
<div class="ligne"><button class="mic" onclick="ecouter('categorie')">🎤</button><input id="categorie" placeholder="Catégorie (ex. maison)"></div>
<div class="ligne"><button class="mic" onclick="ecouter('date')">🎤</button><input id="date" placeholder="Date (ex. 2026-12-25)"></div>
<div class="prio"><span>Priorité</span>
  <button class="p" data-v="1" onclick="choisir('1')">1</button>
  <button class="p" data-v="2" onclick="choisir('2')">2</button>
  <button class="p" data-v="3" onclick="choisir('3')">3</button>
  <button class="p on" data-v="4" onclick="choisir('4')">4</button>
</div>
<button onclick="ajouter()">Ajouter la tâche</button>
<button onclick="lire()">Lire mes tâches à voix haute</button>

<div id="liste"></div>

<button class="gris" onclick="basculer()">Voir / cacher les archives</button>
<div id="archzone" style="display:none">
  <div id="arch"></div>
  <button class="gris" onclick="viderArchives()">Vider les archives</button>
</div>

<script>
var taches = JSON.parse(localStorage.getItem('taches') || '[]');
var archives = JSON.parse(localStorage.getItem('archives') || '[]');
var prio = '4';

function sauver() {
  localStorage.setItem('taches', JSON.stringify(taches));
  localStorage.setItem('archives', JSON.stringify(archives));
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function choisir(v) {
  prio = v;
  var b = document.querySelectorAll('.p');
  for (var i = 0; i < b.length; i++) {
    b[i].className = 'p' + (b[i].getAttribute('data-v') === prio ? ' on' : '');
  }
}

function ajouter() {
  var texte = document.getElementById('texte').value.trim();
  if (!texte) return;
  taches.push({
    texte: texte,
    priorite: prio,
    categorie: document.getElementById('categorie').value.trim() || 'général',
    date: document.getElementById('date').value.trim()
  });
  sauver();
  document.getElementById('texte').value = '';
  document.getElementById('categorie').value = '';
  document.getElementById('date').value = '';
  choisir('4');
  afficher();
}

function terminer(i) {
  var t = taches.splice(i, 1)[0];
  t.fin = new Date().toISOString().slice(0, 10);
  archives.push(t);
  sauver();
  afficher();
  afficherArchives();
}

function afficher() {
  var html = '';
  taches.sort(function (a, b) { return a.priorite - b.priorite; });
  for (var i = 0; i < taches.length; i++) {
    var t = taches[i];
    html += '<div class="tache"><b>' + esc(t.texte) + '</b><br>' +
      '<span class="petit">Priorité ' + t.priorite + ' · ' + esc(t.categorie) +
      (t.date ? ' · pour le ' + esc(t.date) : '') + '</span>' +
      '<button class="fait" onclick="terminer(' + i + ')">Terminée</button></div>';
  }
  if (!html) html = '<p class="petit">Aucune tâche.</p>';
  document.getElementById('liste').innerHTML = html;
}

function afficherArchives() {
  var h = '';
  for (var i = archives.length - 1; i >= 0; i--) {
    var t = archives[i];
    h += '<div class="tache fini"><b>' + esc(t.texte) + '</b><br>' +
      '<span class="petit">' + esc(t.categorie) + ' · terminée le ' + esc(t.fin || '') + '</span></div>';
  }
  if (!h) h = '<p class="petit">Aucune archive.</p>';
  document.getElementById('arch').innerHTML = h;
}

function basculer() {
  var z = document.getElementById('archzone');
  var visible = z.style.display === 'block';
  z.style.display = visible ? 'none' : 'block';
  if (!visible) afficherArchives();
}

function viderArchives() {
  if (confirm('Vider toutes les archives ?')) {
    archives = [];
    sauver();
    afficherArchives();
  }
}

function ecouter(champ) {
  var Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Reco) { alert('La reconnaissance vocale n\'est pas disponible ici.'); return; }
  var r = new Reco();
  r.lang = document.getElementById('langue').value;
  r.onresult = function (ev) {
    document.getElementById(champ).value = ev.results[0][0].transcript;
  };
  r.onerror = function () { alert('Je n\'ai pas compris, réessaie.'); };
  r.start();
}

function lire() {
  speechSynthesis.cancel();
  if (!taches.length) {
    var v = new SpeechSynthesisUtterance('Aucune tâche.');
    v.lang = 'fr-FR';
    speechSynthesis.speak(v);
    return;
  }
  for (var i = 0; i < taches.length; i++) {
    var t = taches[i];
    var arabe = /[\u0600-\u06FF]/.test(t.texte);
    var phrase = arabe
      ? t.texte
      : 'Priorité ' + t.priorite + ', ' + t.categorie + ' : ' + t.texte + '.';
    var u = new SpeechSynthesisUtterance(phrase);
    u.lang = arabe ? 'ar-SA' : 'fr-FR';
    speechSynthesis.speak(u);
  }
}

afficher();
</script>
</body>
</html>
